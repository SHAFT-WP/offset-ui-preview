/*
 * Common FE value-state presentation.
 * Consumers define value foreground/background tokens in their theme.

.value-result {
  color: var(--value-result);
  background-color: var(--value-result-bg, transparent);
}

.value-dependent-input {
  color: var(--value-dependent-input) !important;
  background-color: var(--value-dependent-input-bg, transparent) !important;
}

.value-dependent-change {
  color: var(--value-dependent-change) !important;
  background-color: var(--value-dependent-change-bg, transparent) !important;
  transition: color 1.2s ease, background-color 1.2s ease;
}

svg .value-result {
  fill: var(--value-result);
  background-color: transparent;
}

svg .value-dependent-change {
  fill: var(--value-dependent-change) !important;
  background-color: transparent !important;
  transition: fill 1.2s ease;
}

@media (prefers-reduced-motion: reduce) {

  color: var(--green);
}
.status-message.warning {
  background: var(--amber-soft);
  color: var(--amber);
}
.status-message.invalid {
  background: var(--red-soft);
  color: var(--red);
}
.diagram-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}
.diagram-action-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}
.font-scale-control,
.view-scale-control {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.diagram-control-label {
  font-size: 10px;
  font-weight: 900;
  color: var(--muted);
  letter-spacing: .02em;
}
.diagram-scale-output {
  display: inline-flex;
  min-width: 48px;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 900;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.capture-button:disabled {
  opacity: .42;
  cursor: default;
}
.top-view-shell {
  border: 1px solid #dfe6ee;
  border-radius: 12px;
  background: #fff;
  overflow: hidden;
}
#offset-top-view {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1180/1440;
  background: #fff;
}
#offset-top-view [data-movable-label=true] {
  cursor: grab;
}
#offset-top-view .label-drag-active {
  cursor: grabbing;
}
.diagram-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  color: var(--muted);
  font-size: 10px;
  margin-top: 7px;
}
.legend-dot {
  display: inline-block;
  width: 12px;
  height: 3px;
  vertical-align: middle;
  margin-right: 4px;
}
.ded-section {
  display: grid;
  gap: 10px;
}
.ded-boxes {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.ded-tabs {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.ded-tab {
  min-width: 72px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--field);
  color: var(--muted);
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 950;
  cursor: pointer;
}
.ded-tab.active {
  border-color: var(--blue);
  background: var(--blue-soft);
  color: var(--blue);
}
.ded-tab[hidden] {
  display: none;
}
.ded-screen {
  display: grid;
  gap: 7px;
  padding: 14px 16px;
  border: 1px solid color-mix(in srgb, var(--green) 35%, var(--line));
  border-radius: 12px;
  background: light-dark(#07120c, #050a07);
  color: #9ef0af;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
  box-shadow: inset 0 0 18px rgba(0, 0, 0, .32);
  min-width: 0;
}
.ded-page-title {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .05em;
  padding-bottom: 5px;
  border-bottom: 1px solid rgba(158, 240, 175, .22);
}
.ded-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 10px;
  align-items: baseline;
  font-size: 12px;
}
.ded-row span {
  opacity: .74;
}
.ded-row output {
  font-weight: 850;
  font-variant-numeric: tabular-nums;
  min-width: 0;
  overflow-wrap: anywhere;
}
.ded-foot {
  margin-top: 3px;
  padding-top: 7px;
  border-top: 1px solid rgba(158, 240, 175, .18);
  font-size: 10px;
  opacity: .72;
  letter-spacing: .04em;
}
.result-stack {
  display: grid;
  gap: 10px;
}
.result-table td:first-child {
  width: 42%;
}
.constraint-note {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.4;
}
.alias-note {
  font-size: 10px;
  color: var(--amber);
  margin-top: 6px;
}
@media (max-width:980px) {
  .offset-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width:620px) {
  .driver {
    align-items: flex-start;
    flex-direction: column;
  }
  .offset-grid {
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .offset-card {
    padding: 8px;
  }
  .offset-card.span2 {
    grid-column: span 2;
  }
  .reference-advanced {
    grid-column: 1/-1;
  }
  .vip-to-target-grid {
    grid-template-columns: 1fr 1fr;
  }
  .diagram-actions {
    gap: 4px;
  }
  .diagram-action-row {
    display: grid;
    grid-template-columns: max-content max-content;
    justify-content: end;
    align-items: center;
    gap: 4px 6px;
  }
  .diagram-scale-output {
    min-width: 44px;
  }
  #zoom-reset {
    grid-column: 1;
    grid-row: 1;
  }
  #capture-top-view {
    grid-column: 2;
    grid-row: 1;
  }
  .font-scale-control {
    grid-column: 1;
    grid-row: 2;
  }
  .view-scale-control {
    grid-column: 2;
    grid-row: 2;
  }
  .ded-boxes {
    grid-template-columns: 1fr;
  }
  .ded-tab {
    min-width: 60px;
    padding: 7px 9px;
  }
  .ded-row {
    grid-template-columns: 58px 1fr;
  }
}

&lt;/style&gt;

&lt;body&gt;
&lt;main class=&quot;app&quot; id=&quot;offset-calculator&quot;&gt;
