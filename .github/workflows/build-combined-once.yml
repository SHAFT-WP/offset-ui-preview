name: Build temporary BDP Offset combined standalone

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/build-combined-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Offset work
        uses: actions/checkout@v4
        with:
          ref: work

      - name: Check out BDP work
        uses: actions/checkout@v4
        with:
          repository: SHAFT-WP/bdp-ui-preview
          ref: work
          path: _bdp

      - name: Build combined single HTML
        shell: python
        run: |
          from pathlib import Path
          import html

          bdp = Path("_bdp/bdp-standalone.html").read_text(encoding="utf-8")
          offset = Path("offset-standalone.html").read_text(encoding="utf-8")

          def srcdoc(s):
              return html.escape(s, quote=True)

          out = """<!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Offset + BDP Temporary Combined</title>
            <style>
              :root{color-scheme:dark}
              *{box-sizing:border-box}
              body{margin:0;background:#0f141b;color:#edf3f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
              .shell{width:min(1800px,100%);margin:auto;padding:10px}
              .notice{padding:10px 12px;margin-bottom:10px;border:1px solid #314151;border-radius:10px;background:#18212b;color:#9aa8b6;font-size:12px}
              .block{margin:0 0 16px;border:1px solid #314151;border-radius:14px;overflow:hidden;background:#18212b}
              .bar{padding:10px 14px;font-weight:850;background:#202b37;border-bottom:1px solid #314151}
              iframe{display:block;width:100%;border:0;background:#0f141b}
              #bdp{height:3600px}
              #offset{height:3000px}
              @media(max-width:700px){.shell{padding:0}.block{border-left:0;border-right:0;border-radius:0}#bdp{height:4300px}#offset{height:3600px}}
            </style>
          </head>
          <body>
            <main class="shell">
              <div class="notice">TEMPORARY COMBINED PREVIEW · BDP와 Offset을 한 HTML에 포함. 각 앱은 충돌 방지를 위해 독립 실행 영역으로 유지됩니다.</div>
              <section class="block">
                <div class="bar">Bomb Delivery Planner · full current BDP UI</div>
                <iframe id="bdp" title="Bomb Delivery Planner" srcdoc="__BDP__"></iframe>
              </section>
              <section class="block">
                <div class="bar">Offset Bombing</div>
                <iframe id="offset" title="Offset Bombing" srcdoc="__OFFSET__"></iframe>
              </section>
            </main>
          </body>
          </html>"""
          out = out.replace("__BDP__", srcdoc(bdp)).replace("__OFFSET__", srcdoc(offset))
          Path("offset-bdp-combined-standalone.html").write_text(out, encoding="utf-8")

          assert "Advanced" in bdp
          assert "z-diagram" in bdp
          assert "profile-diagram" in bdp
          assert "top-diagram" in bdp
          assert "offset-top-view" in offset
          assert "bdp-standalone.html" not in out
          assert "offset-standalone.html" not in out

      - name: Commit generated combined file and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _bdp
          git rm .github/workflows/build-combined-once.yml
          git add offset-bdp-combined-standalone.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add temporary BDP Offset combined standalone"
          git push origin work
